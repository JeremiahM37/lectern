# Verify lectern is actually in a working state. Run: verify run .verify.yaml
# (the service is systemd-managed and already running; we verify the live instance)
backend: web

launch:
  url: http://127.0.0.1:9110

options:
  web:
    headless: true
    viewport: [1280, 800]

steps:
  - name: workshop storage preservation regressions
    actions:
      - shell: python3 tools/test_autonomy_storage.py
      - shell: python3 tools/test_autonomy_launch.py

  - name: go, frontend and browser suites pass
    actions:
      - shell:
          # All three suites run at once, each in its own isolated namespace;
          # the browser suite is split across parallel workers. Serially this
          # step took 30-40 minutes on a two-core budget; now about two.
          # ADK_TEST_GOCACHE keeps compiled packages between runs in a cache
          # used only by these test builds.
          cmd: >-
            ADK_ISOLATION_REVIEWED=1 ADK_TEST_CPUS=24
            ADK_TEST_GOCACHE=/mnt/bulk/admin-cache/lectern-test-gocache
            tools/test-all-parallel.sh .
          timeout: 900
    expect:
      no_log_contains: "FAILED"

  - name: systemd service healthy
    actions:
      - shell: systemctl is-active lectern
      - shell: curl -sf http://127.0.0.1:9110/api/health | grep -q '"ok":true'

  - name: board renders live
    actions:
      - navigate: http://127.0.0.1:9110/
      - wait: 2.5
    expect:
      vision: >
        a dark kanban board titled lectern, showing six
        columns (backlog, queued, running, review, done, failed), a quick-dispatch
        input bar at the top, and a LIVE connection indicator; no error text, no
        blank white screen

  - name: sessions tab lists live agents
    actions:
      - click: { selector: ".tab[data-tab='sessions']" }
      - wait: 2.5
    expect:
      vision: >
        a list of interactive agent session cards, each showing a name, a status
        like working or wants you, how long it has been quiet, a preview of
        terminal output, and an Attach button; not a blank page, not an error

  # Deterministic coverage of the sink settings (Discord/ntfy inputs, Save button,
  # Spend card) lives in the Go and Playwright suites; here we only confirm the tab
  # renders in a real browser without erroring. The small local vision model is
  # unreliable at enumerating specific labelled fields, so the visual assert stays
  # coarse and the deterministic tests own the detail.
  - name: targets tab renders
    actions:
      - click: { selector: ".tab[data-tab='targets']" }
      - wait: 1.5
    expect:
      vision: >
        a settings/configuration screen with cards and buttons; not a blank white
        page, not a stack trace, not an error message
