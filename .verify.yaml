# Verify lectern is actually in a working state. Run: verify run .verify.yaml
# (the service is systemd-managed and already running; we verify the live instance)
backend: web

launch:
  url: http://127.0.0.1:9110

options:
  web:
    headless: true
    viewport: [1280, 800]

steps:
  - name: workshop storage preservation regressions
    actions:
      - shell: python3 tools/test_autonomy_storage.py
      - shell: python3 tools/test_provision_python_test_bundle.py
      - shell: python3 tools/test_python_project_dependencies.py
      - shell: python3 tools/test_browser_runtime.py
      - shell: python3 tools/test_node_dependencies.py
      - shell: python3 tools/test_node_project_dependencies.py
      - shell: sudo python3 tools/test_provision_node_runtime.py
      - shell: python3 tools/test_autonomy_gpu_lease.py
      - shell: python3 tools/test_autonomy_gpu_executor.py
      - shell: python3 tools/test_autonomy_gpu_telemetry.py
      - shell: python3 tools/test_autonomy_gpu_runtime.py
      - shell: python3 tools/test_autonomy_gpu_snapshot.py
      - shell: python3 tools/test_autonomy_go_runtime.py
      - shell: python3 tools/test_autonomy_launch.py
      - shell: python3 tools/test_autonomy_expert_probe.py
      - shell: python3 tools/test_autonomy_private_integration.py
      - shell: python3 tools/test_autonomy_server_operations.py
      - shell: python3 tools/test_autonomy_server_maintenance.py
      - shell: python3 tools/test_autonomy_server_maintenance_inspect.py
      - shell:
          cmd: |
            set -eu
            completion_test_dir=$(mktemp -d /tmp/lectern-completion-verify.XXXXXX)
            trap 'rm -rf "$completion_test_dir"' EXIT
            go build -o "$completion_test_dir/lectern" ./cmd/lectern
            LECTERN_OVERLAY_TEST_CLI="$completion_test_dir/lectern" python3 tools/test_autonomy_completion.py
          timeout: 180

  - name: go, frontend and browser suites pass
    actions:
      - shell:
          cmd: go vet ./...
          timeout: 180
      - shell:
          # All three suites run at once, each in its own isolated namespace;
          # the browser suite is split across parallel workers. Serially this
          # step took 30-40 minutes on a two-core budget; now about two.
          # ADK_TEST_GOCACHE keeps compiled packages between runs in a cache
          # used only by these test builds.
          cmd: >-
            ADK_ISOLATION_REVIEWED=1 ADK_TEST_CPUS=24
            ADK_TEST_GOCACHE=/mnt/bulk/admin-cache/lectern-test-gocache
            tools/test-all-parallel.sh .
          timeout: 900
    expect:
      no_log_contains: "FAILED"

  - name: systemd service healthy
    actions:
      - shell: systemctl is-active lectern
      - shell: curl -sf http://127.0.0.1:9110/api/health | grep -q '"ok":true'

  - name: home is the sessions list
    actions:
      - navigate: http://127.0.0.1:9110/
      - wait: 2.5
    expect:
      vision: >
        the Lectern web app with a desktop sidebar showing Sessions, Approvals, Tasks, Terminals
        and Settings directly, with no More flyout, and a list of agent sessions or a clear "Start an agent"
        action; no error text, no blank white screen

  - name: tasks board renders live
    actions:
      - navigate: http://127.0.0.1:9110/#tasks
      - wait: 2.5
    expect:
      vision: >
        a dark task board with several status columns (such as backlog, queued,
        running, review, done, failed) and a way to add a task; no error text, no
        blank white screen

  - name: sessions tab lists live agents
    actions:
      - click: { selector: ".tab[data-tab='sessions']" }
      - wait: 2.5
    expect:
      vision: >
        a list of interactive agent session cards, each showing a name, a status
        like Working, Needs you or Idle, how long it has been quiet, a preview of
        terminal output, and Chat or Terminal buttons; not a blank page, not an error

  # Deterministic coverage of the sink settings (Discord/ntfy inputs, Save button,
  # Spend card) lives in the Go and Playwright suites; here we only confirm the tab
  # renders in a real browser without erroring. The small local vision model is
  # unreliable at enumerating specific labelled fields, so the visual assert stays
  # coarse and the deterministic tests own the detail.
  - name: settings tab renders
    actions:
      - click: { selector: ".tab[data-tab='settings']" }
      - wait: 1.5
    expect:
      vision: >
        a settings/configuration screen with cards and buttons; not a blank white
        page, not a stack trace, not an error message
