services:
  lectern:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lectern
    restart: unless-stopped
    ports:
      - "${LECTERN_BIND:-127.0.0.1}:9110:9110"
    volumes:
      - lectern-data:/data
      # SSH key(s) used to reach targets (read-only)
      # - ./ssh:/data/home/.ssh:ro
    environment:
      # URL targets use to call back for approvals — set to a host reachable FROM targets
      LECTERN_BASE_URL: "${LECTERN_BASE_URL:-http://localhost:9110}"
      LECTERN_AUTH_TOKEN: "${LECTERN_AUTH_TOKEN:-}"
      # LECTERN_VAPID_PUBLIC: ""
      # LECTERN_VAPID_PRIVATE: ""

volumes:
  lectern-data:
