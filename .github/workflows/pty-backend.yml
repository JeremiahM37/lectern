name: PTY backend

# The PTY host is the session backend on Windows and macOS
# (docs/ptyhost.md). These machines are disposable, so the tests that start
# real programs run directly; on Linux they run in the reviewed isolated
# runner (ci.yml). The smoke test builds lectern, serves it, opens a shell,
# types through the API and the web terminal, restarts the server and finds
# the same shell. The attach-client test drives Lectern's own key bar and
# Ctrl+] controls on a real ConPTY / pseudo-terminal, without tmux.
#
# Called by ci.yml on every push and pull request, and by release.yml, which
# does not publish anything unless both platforms pass.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pty-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Session backend, PTY host, web terminal and server smoke tests
        shell: bash
        env:
          LECTERN_PTYHOST_TESTS: "1"
          LECTERN_SERVER_SMOKE: "1"
        run: >-
          go test -count=1 -v
          ./internal/sessions/backend/
          ./internal/ptyhost/...
          ./internal/terminal/webterm/
          ./internal/gitbash/
          ./internal/smoke/
          ./cmd/lectern/localruntime/
      - name: Attach client without tmux
        shell: bash
        env:
          LECTERN_PTYHOST_TESTS: "1"
        run: go test -count=1 -v -run '^TestBareAttachmentControls' ./cmd/lectern/
