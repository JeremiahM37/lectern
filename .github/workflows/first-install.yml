name: First install acceptance
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  docker-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build the real image
        run: docker build -f deploy/Dockerfile -t lectern:acceptance .
      - name: Fresh install, browser onboarding, persistence and SSH sessions
        env:
          LECTERN_TEST_IMAGE: lectern:acceptance
          LECTERN_TEST_URL: http://127.0.0.1:19110
        run: python tools/test-container-install.py
