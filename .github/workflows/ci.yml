name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Install isolated integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tmux ttyd
          # Ubuntu's hosted image enables AppArmor's restriction on
          # unprivileged user namespaces. That blocks bwrap's private network
          # namespace setup (RTM_NEWADDR) before the reviewed runner can
          # start. This VM is disposable; restore the normal unprivileged
          # user-namespace behavior and retain bwrap's own bounded UID/GID
          # mapping and network isolation.
          apparmor_userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$apparmor_userns" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(cat "$apparmor_userns")" = 0
          fi
          # The runner mounts GOROOT below the read-only /usr bind; create
          # its mountpoint before bwrap starts.
          sudo mkdir -p /usr/local/go
          uid=$(id -u)
          user=$(id -un)
          sudo loginctl enable-linger "$user"
          sudo systemctl start "user-runtime-dir@${uid}.service"
          sudo systemctl start "user@${uid}.service"
          runtime=/run/user/${uid}
          test "$(stat -c %u "$runtime")" = "$uid"
          test -S "$runtime/bus" || {
            echo "could not provision an owned systemd user bus for the reviewed test runner" >&2
            exit 1
          }
      - name: Prove isolated runner namespace
        env:
          ADK_ISOLATION_REVIEWED: "1"
          ADK_TEST_MODE: smoke
        run: |
          runtime=/run/user/$(id -u)
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            tools/run-isolated-tests.sh .
      # Real integration tests use temporary repositories and scripted agents.
      # They must run in the reviewed bwrap namespace: RequireIsolated checks
      # the kernel UID/GID mappings and rejects a marker set on the host.
      - name: Test
        env:
          ADK_ISOLATION_REVIEWED: "1"
          ADK_TEST_MODE: go
        run: |
          runtime=/run/user/$(id -u)
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            tools/run-isolated-tests.sh .
      - name: Windows client syntax and argument handling
        shell: pwsh
        run: ./tests/check-powershell-client.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Python environment
        run: |
          python -m venv --copies "$RUNNER_TEMP/lec-venv"
          "$RUNNER_TEMP/lec-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/lec-venv/bin/pip" install pytest pytest-xdist playwright pyte==0.8.2 asyncssh
          echo "LEC_PYTHON_BASE=$(python -c 'import sys; print(sys.base_prefix)')" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/lec-playwright" \
            "$RUNNER_TEMP/lec-venv/bin/python" -m playwright install --with-deps chromium
      - name: Install terminal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap tmux ttyd
          apparmor_userns=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$apparmor_userns" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(cat "$apparmor_userns")" = 0
          fi
          sudo mkdir -p /usr/local/go
          uid=$(id -u)
          user=$(id -un)
          sudo loginctl enable-linger "$user"
          sudo systemctl start "user-runtime-dir@${uid}.service"
          sudo systemctl start "user@${uid}.service"
          runtime=/run/user/${uid}
          test "$(stat -c %u "$runtime")" = "$uid"
          test -S "$runtime/bus"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend and stage Go embeds
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend
          python3 frontend/scripts/stage.py
          # The reviewed runner bind-mounts these caches writable below the
          # otherwise read-only dependency tree; create the mountpoints after
          # npm ci so bwrap does not need to mutate that tree.
          mkdir -p frontend/node_modules/.vite frontend/node_modules/.vite-temp
      - name: Browser end-to-end
        env:
          ADK_ISOLATION_REVIEWED: "1"
          ADK_TEST_MODE: e2e
          # Hosted runners have four cores: two browser workers.
          ADK_TEST_CPUS: "4"
          ADK_PYTHON_VENV: ${{ runner.temp }}/lec-venv
          ADK_PLAYWRIGHT_CACHE: ${{ runner.temp }}/lec-playwright
        run: |
          runtime=/run/user/$(id -u)
          XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus" \
            tools/run-isolated-tests.sh .
